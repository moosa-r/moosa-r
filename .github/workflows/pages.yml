name: Validate and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

env:
  INDEXNOW_KEY: 3da5e170414d9789461240a14bffdebf

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate website
        run: python -B tools/check_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow
        continue-on-error: true
        run: >
          curl --fail --silent --show-error
          --connect-timeout 10 --max-time 30
          --retry 3 --retry-delay 2 --retry-all-errors
          --get https://api.indexnow.org/indexnow
          --data-urlencode "url=https://moosa-r.com/"
          --data-urlencode "key=${INDEXNOW_KEY}"
          --data-urlencode "keyLocation=https://moosa-r.com/${INDEXNOW_KEY}.txt"
